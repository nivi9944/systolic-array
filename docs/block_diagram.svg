<text x="805" y="345" text-anchor="middle" font-size="11" fill="#92400e">IDLE</text>
<text x="805" y="365" text-anchor="middle" font-size="11" fill="#92400e">STREAM (K beats)</text>
<text x="805" y="385" text-anchor="middle" font-size="11" fill="#92400e">FLUSH (2N+1)</text>
<text x="805" y="405" text-anchor="middle" font-size="11" fill="#92400e">DRAIN (N rows)</text>
<text x="805" y="425" text-anchor="middle" font-size="11" fill="#92400e">DONE</text>
<text x="805" y="470" text-anchor="middle" font-size="11" fill="#92400e">shift, s_ready, m_valid</text>
<text x="805" y="485" text-anchor="middle" font-size="11" fill="#92400e">(all from flip-flops)</text>
<text x="450" y="540" text-anchor="middle" font-size="12" fill="#4b5563">A moves right, B moves down, PE(i,j) keeps C[i][j]. Latency = K + 3N + 3 cycles (start to done).</text>
<text x="450" y="562" text-anchor="middle" font-size="12" fill="#4b5563">Each PE: private operand copy, registered INT8 x INT8 product, 22-bit accumulator (chip build).</text>
